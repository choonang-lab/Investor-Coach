<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Investor Coach</title>
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Investor">
<meta name="theme-color" content="#284B7A">
<style>
:root{--bg:#F3F4F6;--card:#FFFFFF;--ink:#1B2230;--mute:#626B7A;--line:#E0E3E9;--accent:#284B7A;--accent-soft:#E3EAF4;--on-accent:#FFFFFF;--good:#2E7D4F;--good-soft:#E0F1E6;--bad:#B4472F;--bad-soft:#F8E4DD;--warn:#8F6300;--warn-soft:#FAEFD2;--chip:#ECEEF2}
@media (prefers-color-scheme:dark){:root{--bg:#11141A;--card:#1A1F27;--ink:#E7EAF0;--mute:#9AA2B0;--line:#2A313C;--accent:#8EB4E8;--accent-soft:#1E2B3D;--on-accent:#0C1522;--good:#6FC892;--good-soft:#1A3023;--bad:#EA8D76;--bad-soft:#3A211B;--warn:#E3B755;--warn-soft:#332912;--chip:#252B35}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px}
.wk{font-size:13px;color:var(--mute);text-align:right}
main{max-width:640px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
nav#tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav#tabbar button{flex:1;background:none;border:0;padding:8px 0 6px;color:var(--mute);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
nav#tabbar button.on{color:var(--accent);font-weight:600}
nav#tabbar .badge{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:var(--on-accent);border-radius:999px;font-size:10px;font-weight:700;padding:0 5px;line-height:16px}
nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card.cool{border-color:var(--warn);background:var(--warn-soft)}
.ch{font-weight:650;font-size:16px;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.kicker{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);font-weight:700}
.h2{font-size:20px;font-weight:700;margin:2px 0 4px}
.mute{color:var(--mute)}
.small{font-size:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.lbl{flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:var(--card);border:0;border-left:1px solid var(--line);padding:9px 2px;font:inherit;font-size:14px;color:var(--ink);min-width:0;min-height:42px}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.typegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.typegrid button{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 4px;font:inherit;font-size:14px;color:var(--ink)}
.typegrid button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font:inherit;font-size:13px;color:var(--ink)}
.chipb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.chipb.on.hot{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
input[type=range]{width:100%;padding:0;border:0;background:none;accent-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);vertical-align:middle}
textarea{width:100%;min-height:60px;resize:vertical;display:block}
select{width:100%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;font-size:15px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{flex:1;padding:13px}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);font-weight:600;text-decoration:underline}
.chip{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--mute);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.info{background:var(--accent-soft);color:var(--accent)}
.flags{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
.box{width:22px;height:22px;border:2px solid var(--mute);border-radius:6px;flex-shrink:0;margin-top:1px;display:grid;place-items:center}
.check.done .box{background:var(--good);border-color:var(--good)}
.check.done .box::after{content:"";width:6px;height:11px;border:solid var(--on-accent);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check.done .ct{color:var(--mute)}
.when{font-size:12px;color:var(--mute)}
.note{border-radius:12px;padding:12px 14px;margin:0 0 12px;font-size:15px}
.note.good{background:var(--good-soft)}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.info{background:var(--accent-soft)}
.note ol{margin:6px 0 0;padding-left:20px}
.note li{margin:3px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--bg);border-radius:10px;padding:10px}
.stat .v{font-size:19px;font-weight:700}
.stat .v.bad{color:var(--bad)}
.stat .k{font-size:12px;color:var(--mute)}
.tw{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
.tw:first-of-type{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--accent)}
.dot.warn{background:var(--warn)}
.dot.bad{background:var(--bad)}
.dot.good{background:var(--good)}
.rt{font-size:19px;font-weight:650;line-height:1.35;margin:4px 0 6px}
.quote{border-left:3px solid var(--line);padding:2px 0 2px 10px;margin:8px 0;font-size:15px}
.kill{background:var(--bad-soft);border-radius:8px;padding:6px 10px;margin:6px 0;font-size:14px}
.kill b{color:var(--bad)}
.matrix{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;font-size:13px;align-items:stretch}
.matrix .h{color:var(--mute);font-size:12px;text-align:center;align-self:end}
.matrix .rh{color:var(--mute);font-size:12px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.matrix .m{border-radius:10px;padding:8px;text-align:center}
.matrix .m b{display:block;font-size:22px}
.m.g{background:var(--good-soft)}.m.l{background:var(--accent-soft)}.m.d{background:var(--warn-soft)}.m.x{background:var(--bad-soft)}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl td,.tbl th{padding:7px 4px;border-top:1px solid var(--line);text-align:left}
.tbl th{font-size:12px;color:var(--mute);font-weight:600;border-top:0}
.tbl td.n{text-align:right;white-space:nowrap}
.pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
svg.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .lab{fill:var(--mute);font-size:10px}
.chart .tk{fill:var(--ink);font-size:10px;font-weight:600}
.chart .diag{stroke:var(--mute);stroke-width:1.2;stroke-dasharray:4 3}
.chart .band{fill:var(--good-soft)}
.chart .tgt{stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 3}
.chart .pt{fill:var(--accent)}
.chart .pt.off{fill:var(--bad)}
.chart .bar{fill:var(--accent)}
.chart .bar.over{fill:var(--bad)}
.chart .bud{stroke:var(--warn);stroke-width:1.5;stroke-dasharray:4 3}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
#toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
#toast.show{opacity:1}
.field{display:block;margin:10px 0}
.field>span{display:block;font-size:13px;color:var(--mute);margin-bottom:4px}
.field input:not([type=range]):not([type=checkbox]){width:100%}
.build{font-size:12px;color:var(--mute);text-align:center;margin:16px 0}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
h3.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:18px 0 8px;font-weight:700}
.q{font-weight:600;font-size:14px;margin:12px 0 6px}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
details.card>summary{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
summary.q{color:var(--accent)}
.rrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.lv{letter-spacing:2px;color:var(--accent);font-size:11px}
.inline{display:flex;gap:8px;align-items:center;font-size:14px;margin:10px 0 4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px;margin:8px 0}
.kv dt{color:var(--mute)}
.kv dd{margin:0}
</style>
</head>
<body>
<header><div class="brand">Investor Coach</div><div id="sub" class="wk"></div></header>
<main id="main"></main>
<nav id="tabbar"></nav>
<div id="toast"></div>
<script>
const BUILD = 'v1';
const KEY = 'ic_data';
const GHKEY = 'ic_gh';
const DIRTY = 'ic_dirty';
const DRAFT = 'ic_draft';
const DAY = 864e5;
const CHECKS = [30, 90, 365];
const LEITNER = [1, 3, 7, 14, 30];
const $ = (s) => document.querySelector(s);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

/* ---------- Content: the four failure modes ---------- */
const CATS = [
  { id: 'analysis', t: 'Analysis', d: 'Getting the thesis right' },
  { id: 'selling', t: 'Selling', d: 'Selling winners early, holding losers' },
  { id: 'impulse', t: 'Impulse', d: 'Overtrading and acting on urges' },
  { id: 'sizing', t: 'Sizing', d: 'Focus, conviction and position size' },
  { id: 'mind', t: 'Mindset', d: 'Process over outcome' }
];
function catT(id) { const c = CATS.find((x) => x.id === id); return c ? c.t : id; }

/* Rule ids are progress keys: never rename or reuse them. pre:1 = shown as a pre-flight check on Buy/Add. */
const RULES = [
  { id: 'a1', cat: 'analysis', pre: 1, t: 'Do I already own this? Check every holdings record before writing a single number.', why: 'The same arithmetic means "buy" to a newcomer and "sell" to a holder. A verdict in the wrong register is confident advice about the wrong decision.' },
  { id: 'a2', cat: 'analysis', pre: 1, t: 'Down more than 40% from the high? Read every filing in the drawdown window, exhibits included.', why: 'Standstills, observer seats, credit amendments and share pledges sit in exhibits that no summary, release or call mentions.' },
  { id: 'a3', cat: 'analysis', pre: 1, t: 'Check the date on every price and data point before scoring.', why: 'A stale quote is not a small error. Every verdict is an expected value from today’s price.' },
  { id: 'a4', cat: 'analysis', pre: 1, t: 'Write the base rate before the story.', why: 'How often do situations like this work? Start there, then adjust for what is different. The story will always feel like the exception.' },
  { id: 'a5', cat: 'analysis', pre: 1, t: 'State what the market believes, and in one sentence why it is wrong.', why: 'No variant view, no edge. Agreeing with the price is a reason to own an index fund.' },
  { id: 'a6', cat: 'analysis', pre: 1, t: 'Pre-mortem: it is two years later and this lost half. Write the most likely reason.', why: 'Imagining the failure as already happened surfaces risks that optimism hides.' },
  { id: 'a7', cat: 'analysis', t: 'Read the primary source. Summaries stop one layer above the load-bearing fact.', why: 'The cash flow statement, the licence terms, the exhibit: the fact that decides the case is rarely in the article.' },
  { id: 'a8', cat: 'analysis', t: 'In-licensed is not owned. Who gets paid on every dollar of sales?', why: 'Royalties and milestones owed to a licensor come off the top. Read the licence section before applying any multiple.' },
  { id: 'a9', cat: 'analysis', t: 'Read exclusivity dates from the annual report before valuing a product.', why: 'Patent life produces no news until it is challenged, so a wrong expiry date can sit unexamined for months.' },
  { id: 'a10', cat: 'analysis', t: 'If my best case sits below the most bearish analyst’s base case, audit my market size first.', why: 'When everyone disagrees with you in one direction, the gap is usually an input, not insight. Bridge one input at a time.' },
  { id: 'a11', cat: 'analysis', t: 'When a company stops reporting a metric I was tracking, assume the bad case.', why: 'A withdrawn number is information. Pre-commit to the adverse default so you cannot explain it away later.' },
  { id: 'a12', cat: 'analysis', t: 'Work out an activist’s or insider’s cost basis before reading their buying as a signal.', why: 'Buying far below their own cost may be averaging down, not bottom-fishing. The inference can flip.' },
  { id: 's1', cat: 'selling', t: 'Clean-slate test: if I held cash instead, would I buy this today, at this size?', why: 'If the answer is no, the only thing keeping the position is that you already own it.' },
  { id: 's2', cat: 'selling', t: 'Sell when the thesis breaks, not when the price moves.', why: 'A price move is a reason to re-check the thesis, not a verdict on it. Re-read the kill criteria first.' },
  { id: 's3', cat: 'selling', t: 'My purchase price means nothing to the market.', why: 'Anchoring on cost makes you hold losers to get back to even and sell winners to lock in a number.' },
  { id: 's4', cat: 'selling', t: 'Reaching a price target is a reason to re-underwrite, not an automatic sale.', why: 'Re-value from today. If the business improved, the target moved too. Trim to size rather than sell out.' },
  { id: 's5', cat: 'selling', t: 'Write the sell condition before the buy.', why: 'Kill criteria written while calm are the only ones you will honour in a drawdown.' },
  { id: 's6', cat: 'selling', t: 'Kill criteria hit? Act within a week, or write down why the criteria were wrong.', why: 'The most expensive habit is moving the goalposts quietly.' },
  { id: 's7', cat: 'selling', t: 'Trim in steps. Do not decide everything in one emotional moment.', why: 'Scaling out cuts the regret of being wrong in either direction, which makes it easier to act at all.' },
  { id: 'i1', cat: 'impulse', t: 'Unplanned trade? Wait 24 hours.', why: 'If it is a good idea today it will still be one tomorrow. Most urges do not survive a night.' },
  { id: 'i2', cat: 'impulse', t: 'If the main reason is that the price moved today, do not trade today.', why: 'A move is information to research, not an instruction to act.' },
  { id: 'i3', cat: 'impulse', t: 'Boredom is not a thesis.', why: 'Activity feels like progress. Most of the return comes from a few decisions held for a long time.' },
  { id: 'i4', cat: 'impulse', t: 'After a big loss or a big win, no new positions for 48 hours.', why: 'Losses breed revenge trades and wins breed overconfidence. Both feel like clarity at the time.' },
  { id: 'i5', cat: 'impulse', t: 'Decide when markets are closed. During the session, only execute what was already decided.', why: 'Live prices pull you into reacting. Thinking happens best away from the screen.' },
  { id: 'i6', cat: 'impulse', t: 'An urge resisted is a win. Log it.', why: 'What gets counted gets reinforced. Resisting is a skill that improves with repetition.' },
  { id: 'z1', cat: 'sizing', t: 'Size to the downside, not the upside.', why: 'Ask what you lose if the kill case happens, and size so that loss is survivable and unremarkable.' },
  { id: 'z2', cat: 'sizing', t: 'If I would not double it, is my conviction really high?', why: 'High conviction you would never act on is just familiarity.' },
  { id: 'z3', cat: 'sizing', t: 'Fewer, bigger, better-understood bets. A new idea in means an old one out.', why: 'Every extra name dilutes research time. The idea cap is there to force the choice.' },
  { id: 'z4', cat: 'sizing', t: 'Bigger than my own framework says? Trim toward size. It is not a debate.', why: 'The framework exists for the moments when you are attached. Overriding it should need a written reason.' },
  { id: 'z5', cat: 'sizing', t: 'Conviction comes from work done, not time spent watching.', why: 'Score conviction from the variant view, the base rate and the downside, not from how long you have followed the name.' },
  { id: 'z6', cat: 'sizing', t: 'High conviction and a tiny position? Size up or lower the score.', why: 'A mismatch between belief and size means one of the two is wrong.' },
  { id: 'm1', cat: 'mind', t: 'Judge the decision, not the outcome.', why: 'Good decisions lose money sometimes and bad ones make money. Grade the process you could control.' },
  { id: 'm2', cat: 'mind', t: 'Write it down before acting. Memory rewrites the reasons afterwards.', why: 'Hindsight makes every result feel obvious. The written record is the only honest teacher.' },
  { id: 'm3', cat: 'mind', t: 'Being early and being wrong look the same for a while. My kill criteria tell me which.', why: 'Without them, every loser is just early.' },
  { id: 'm4', cat: 'mind', t: 'Calibration beats confidence.', why: 'When you say 70%, it should happen about 7 times in 10. Most people are overconfident until they measure it.' }
];

const PROMPTS = [
  'What did I want to do in the market today, and did I?',
  'Which holding would I not buy today at its current size?',
  'What would make me sell my largest position? Is any of it true yet?',
  'Which idea on my list could I drop without losing anything?',
  'Where did I feel certain today? What would a smart bear say?',
  'What did I read today that changed a number, not just a feeling?',
  'Is there a decision I am avoiding? Why?',
  'Which position do I check most often, and what does that say?',
  'What do I know about a holding that the price does not reflect?',
  'If I could own only three of my names, which three?',
  'Did I act today on a plan, or on a feeling?',
  'What would I tell a friend who held my portfolio?',
  'Which kill criteria are closest to firing?',
  'What am I hoping for, rather than expecting?'
];

const TYPES = [
  { id: 'buy', t: 'Buy', dir: 1, trade: true },
  { id: 'add', t: 'Add', dir: 1, trade: true },
  { id: 'hold', t: 'Hold', dir: 1 },
  { id: 'trim', t: 'Trim', dir: -1, trade: true },
  { id: 'sell', t: 'Sell', dir: -1, trade: true },
  { id: 'pass', t: 'Pass', dir: -1 },
  { id: 'watch', t: 'Watch', dir: 0 }
];
function T(id) { return TYPES.find((x) => x.id === id) || TYPES[0]; }
const HELD = ['buy', 'add', 'hold', 'trim'];
const FW = ['BUY', 'ADD', 'HOLD', 'TRIM', 'EXIT', 'PASS'];
const FAM = { buy: 'up', add: 'up', hold: 'hold', trim: 'down', sell: 'down', pass: 'none', watch: 'none', BUY: 'up', ADD: 'up', HOLD: 'hold', TRIM: 'down', EXIT: 'down', PASS: 'none' };

const EMO = [
  { id: 'calm', t: 'Calm' }, { id: 'confident', t: 'Confident' },
  { id: 'excited', t: 'Excited', hot: 1 }, { id: 'fomo', t: 'FOMO', hot: 1 }, { id: 'fear', t: 'Fearful', hot: 1 },
  { id: 'frustrated', t: 'Frustrated', hot: 1 }, { id: 'bored', t: 'Bored', hot: 1 }, { id: 'tired', t: 'Tired', hot: 1 },
  { id: 'revenge', t: 'Want to win it back', hot: 1 }
];
function isHot(list) { return (list || []).some((e) => { const x = EMO.find((m) => m.id === e); return x && x.hot; }); }
function emoNames(list) { return (list || []).map((e) => { const x = EMO.find((m) => m.id === e); return x ? x.t : e; }).join(', '); }

const SELLWHY = [
  { id: 'broken', t: 'Thesis broken' }, { id: 'target', t: 'Reached fair value' }, { id: 'better', t: 'Better use of capital' },
  { id: 'size', t: 'Too big for my conviction' }, { id: 'fear', t: 'Price is falling, I am scared', hot: 1 }, { id: 'cash', t: 'Need the cash' }, { id: 'tax', t: 'Tax' }
];

const TAGS = [
  { id: 'missed-source', c: 'analysis', t: 'Missed a filing or primary source' }, { id: 'base-rate', c: 'analysis', t: 'Ignored the base rate' },
  { id: 'bad-input', c: 'analysis', t: 'Wrong model input' }, { id: 'story', c: 'analysis', t: 'Bought the story' }, { id: 'stale', c: 'analysis', t: 'Used stale data' },
  { id: 'sold-early', c: 'selling', t: 'Sold a winner too early' }, { id: 'held-loser', c: 'selling', t: 'Held past my kill criteria' },
  { id: 'anchored', c: 'selling', t: 'Anchored on cost or an old price' }, { id: 'no-exit', c: 'selling', t: 'Had no exit plan' },
  { id: 'unplanned', c: 'impulse', t: 'Unplanned trade' }, { id: 'chased', c: 'impulse', t: 'Chased a move' },
  { id: 'hot', c: 'impulse', t: 'Decided in a hot state' }, { id: 'overtraded', c: 'impulse', t: 'Traded for activity' },
  { id: 'oversized', c: 'sizing', t: 'Too big for the conviction' }, { id: 'undersized', c: 'sizing', t: 'Too small for the conviction' },
  { id: 'too-many', c: 'sizing', t: 'Spread across too many ideas' }, { id: 'over-fw', c: 'sizing', t: 'Overrode my own framework' },
  { id: 'luck', c: 'mind', t: 'Right for the wrong reason' }, { id: 'followed', c: 'good', t: 'Followed my rules' }, { id: 'variant-right', c: 'good', t: 'My variant view was right' }
];

const STATES = [
  { id: 'calm', t: 'Calm' }, { id: 'steady', t: 'Steady' }, { id: 'restless', t: 'Restless', hot: 1 },
  { id: 'anxious', t: 'Anxious', hot: 1 }, { id: 'euphoric', t: 'Euphoric', hot: 1 }
];
const URGES = [{ id: 'none', t: 'No urge' }, { id: 'resisted', t: 'Resisted one' }, { id: 'acted', t: 'Acted on one' }];

/* ---------- Helpers ---------- */
function pad(n) { return String(n).padStart(2, '0'); }
function ds(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function pd(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ds(d); }
function diffDays(a, b) { return Math.round((pd(b) - pd(a)) / DAY); }
function todayStr() { return ds(new Date()); }
function nice(s) { const d = pd(s); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== new Date().getFullYear() ? ' ' + d.getFullYear() : ''); }
function fmtTime(iso) { const d = new Date(iso); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()] + ', ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function monday(s) { const g = (pd(s).getDay() + 6) % 7; return addDays(s, -g); }
function isNum(v) { return typeof v === 'number' && !isNaN(v) && isFinite(v); }
function num(v) { if (v === null || v === undefined || v === '') return null; const n = parseFloat(v); return isNaN(n) ? null : n; }
function avg(a) { return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function fmt(n, dp) { if (!isNum(n)) return '–'; const p = Math.pow(10, dp === undefined ? 1 : dp); return String(Math.round(n * p) / p); }
function pct(n) { if (!isNum(n)) return '–'; return (n > 0 ? '+' : '') + fmt(n) + '%'; }
function pctCls(n) { return !isNum(n) ? '' : n > 0 ? 'pos' : n < 0 ? 'neg' : ''; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return h; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2400); }
function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

/* ---------- State ---------- */
function blank() {
  return { v: 1, settings: { tradeBudget: 6, coolHours: 24, ideaCap: 10, maxPos: 15 },
    decisions: {}, deleted: {}, days: {}, weeks: {}, cards: {}, myCards: {}, lastBackup: null, savedAt: null };
}
function fill(d, b) {
  for (const k in b) {
    if (d[k] === undefined) d[k] = b[k];
    else if (b[k] && typeof b[k] === 'object' && !Array.isArray(b[k]) && d[k] && typeof d[k] === 'object') fill(d[k], b[k]);
  }
  return d;
}
function load() {
  try { const r = localStorage.getItem(KEY); if (r) return fill(JSON.parse(r), blank()); } catch (e) {}
  return blank();
}
let D = load();
function persist() { try { localStorage.setItem(KEY, JSON.stringify(D)); } catch (e) { toast('Could not save on this device'); } }
function save() { D.savedAt = new Date().toISOString(); persist(); markDirty(); }

function decs() { return Object.values(D.decisions).sort((a, b) => (a.date === b.date ? (a.at < b.at ? 1 : -1) : (a.date < b.date ? 1 : -1))); }
function dayRec(s, create) { if (!D.days[s]) { if (!create) return null; D.days[s] = {}; } return D.days[s]; }
function latestByTicker() {
  const m = {};
  decs().slice().reverse().forEach((d) => { if (d.status !== 'done') return; m[d.tk] = d; });
  return m;
}
function holdings() { return Object.values(latestByTicker()).filter((d) => HELD.includes(d.type)); }
function watching() { return Object.values(latestByTicker()).filter((d) => d.type === 'watch'); }
function target(conv) { return D.settings.maxPos * conv / 10; }
function sizeFit(d) {
  const s = num(d.size), c = num(d.conv); if (!isNum(s) || !isNum(c)) return '';
  const t = target(c);
  if (s > t * 1.5 && s - t > 1) return 'over';
  if (s < t * 0.5 && t - s > 1) return 'under';
  return 'ok';
}
function fwMismatch(d) { return !!(d.fw && FAM[d.fw] && FAM[d.type] && FAM[d.fw] !== FAM[d.type]); }
function doneMonth(d) { return (d.doneAt ? ds(new Date(d.doneAt)) : d.date).slice(0, 7); }
function tradesInMonth(mk) { return Object.values(D.decisions).filter((d) => d.status === 'done' && T(d.type).trade && doneMonth(d) === mk).length; }
function urgesInMonth(mk) {
  const dropped = Object.values(D.decisions).filter((d) => d.status === 'dropped' && (d.droppedAt ? ds(new Date(d.droppedAt)) : d.date).slice(0, 7) === mk).length;
  const days = Object.keys(D.days).filter((s) => s.slice(0, 7) === mk && D.days[s].urge === 'resisted').length;
  return dropped + days;
}
function checked(s) { const x = D.days[s]; return !!(x && (x.state || x.urge || (x.note || '').trim())); }
function streak() { let s = todayStr(); if (!checked(s)) s = addDays(s, -1); let n = 0; while (checked(s)) { n++; s = addDays(s, -1); } return n; }

/* ---------- Reviews and scoring ---------- */
function dueList() {
  const t = todayStr(), out = [];
  decs().forEach((d) => {
    if (d.status !== 'done' || d.type === 'watch') return;
    CHECKS.forEach((n) => { const date = addDays(d.date, n); if (date <= t && !(d.cps && d.cps[n])) out.push({ d, n, date }); });
  });
  return out.sort((a, b) => (a.date < b.date ? -1 : 1));
}
function latestCp(d) { const ks = Object.keys(d.cps || {}).map(Number).sort((a, b) => b - a); return ks.length ? d.cps[ks[0]] : null; }
function edge(d, cp) {
  if (!cp || !isNum(num(cp.px)) || !isNum(num(d.px)) || !num(d.px)) return null;
  const dir = T(d.type).dir; if (!dir) return null;
  return (num(cp.px) - num(d.px)) / num(d.px) * 100 * dir;
}
function thScore(th) { return th === 'yes' ? 1 : th === 'partly' ? 0.5 : th === 'no' ? 0 : null; }
function scored() {
  const out = [];
  Object.values(D.decisions).forEach((d) => { if (d.status !== 'done') return; const cp = latestCp(d); if (!cp) return; out.push({ d, cp, e: edge(d, cp), th: thScore(cp.th) }); });
  return out;
}
function catWeights() {
  const w = {}; CATS.forEach((c) => { w[c.id] = 1; });
  Object.values(D.decisions).forEach((d) => Object.values(d.cps || {}).forEach((cp) => (cp.tags || []).forEach((t) => {
    const g = TAGS.find((x) => x.id === t); if (g && w[g.c] !== undefined) w[g.c]++;
  })));
  return w;
}

/* ---------- Rulebook (spaced repetition) ---------- */
function allCards() {
  const mine = Object.values(D.myCards).filter((c) => !c.deleted).map((c) => Object.assign({ mine: 1 }, c));
  return RULES.concat(mine).filter((c) => !(D.cards[c.id] && D.cards[c.id].off));
}
function preCards() { return allCards().filter((c) => c.pre); }
function boxOf(c) { return (D.cards[c.id] && D.cards[c.id].box) || 0; }
function cardPool(s) {
  const w = catWeights(), cards = allCards();
  const due = cards.filter((c) => { const st = D.cards[c.id]; return !st || !st.due || st.due <= s; });
  const pool = (due.length ? due : cards).slice();
  pool.sort((a, b) => (boxOf(a) - boxOf(b)) || ((w[b.cat] || 1) - (w[a.cat] || 1)) || (hash(a.id + s) - hash(b.id + s)));
  return pool;
}
function cardOfDay(s) {
  const all = allCards(); if (!all.length) return null;
  const dd = dayRec(s, true);
  let c = dd.card && all.find((x) => x.id === dd.card);
  if (!c) { c = cardPool(s)[0]; dd.card = c.id; persist(); }
  return c;
}
function levelDots(c) { const b = boxOf(c); let s = ''; for (let i = 1; i <= 5; i++) s += i <= b ? '●' : '○'; return s; }

/* ---------- Render ---------- */
let view = 'today';
let followToday = true;
const RV = {};
const ICONS = {
  today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',

  review: '<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',

};
function render() {
  const t = todayStr(), mk = t.slice(0, 7);
  $('#sub').innerHTML = nice(t) + ' · trades ' + tradesInMonth(mk) + '/' + D.settings.tradeBudget;
  const due = dueList().length;
  $('#tabbar').innerHTML = [['today', 'Today'], ['decide', 'Decide'], ['book', 'Book'], ['review', 'Review'], ['more', 'More']].map(([id, l]) =>
    '<button class="' + (view === id ? 'on' : '') + '" data-act="tab" data-v="' + id + '">' + ICONS[id] + l + (id === 'review' && due ? '<span class="badge">' + due + '</span>' : '') + '</button>').join('');

}
function seg(act, k, opts, val, extra) {
  return '<div class="seg">' + opts.map((o) => '<button class="' + (val === o.id ? 'on' : '') + '" data-act="' + act + '" data-k="' + esc(k) + '" data-v="' + o.id + '"' + (extra || '') + '>' + esc(o.t) + '</button>').join('') + '</div>';
}
function stat(v, k, cls) { return '<div class="stat"><div class="v ' + (cls || '') + '">' + v + '</div><div class="k">' + esc(k) + '</div></div>'; }

/* ---------- Today ---------- */
function vToday() {
  const s = todayStr(), mk = s.slice(0, 7), dd = D.days[s] || {}, all = decs();
  let h = '';
  if (!all.length) {
    h += '<div class="note info"><b>Start here</b><ol>' +
      '<li>Log each current holding as a <b>Hold</b>: one-line thesis, size, conviction and kill criteria.</li>' +
      '<li>Back-fill a few past trades with their real dates and prices, so reviews come due now instead of in 30 days.</li>' +
      '<li>Check in here each evening. Two minutes.</li>' +
      '<li>Before any future trade, log it on <b>Decide</b> first.</li></ol></div>';
  }

    const ready = new Date(d.coolUntil) <= new Date();
    h += '<div class="card cool"><div class="kicker">Cooling off</div><div class="h2">' + T(d.type).t + ' ' + esc(d.tk) + '</div>' +
      '<div class="quote">' + esc(d.thesis) + '</div>' +
      (d.flags && d.flags.length ? '<div class="when">Flagged: ' + esc(d.flags.join(' ')) + '</div>' : '') +

      '<div class="actions"><button class="btn' + (ready ? '' : ' ghost') + '" data-act="cdo" data-k="' + d.id + '">' + (ready ? 'I did it' : 'Do it anyway (logged)') + '</button>' +
      '<button class="btn' + (ready ? ' ghost' : '') + '" data-act="cdrop" data-k="' + d.id + '">Drop it</button></div></div>';
  });

  const nudges = [];

  if (due.length) nudges.push({ lvl: 'warn', t: plural(due.length, 'decision review') + ' due', act: 'tab', v: 'review', b: 'Review' });
  const hs = holdings();

  if (gaps.length) nudges.push({ lvl: 'bad', t: 'Acting against your own framework: ' + gaps.map((d) => d.tk + ' (says ' + d.fw + ', you ' + T(d.type).t.toUpperCase() + ')').join(', '), act: 'tab', v: 'book', b: 'Book' });
  const off = hs.filter((d) => sizeFit(d) === 'over' || sizeFit(d) === 'under');
  if (off.length) nudges.push({ lvl: 'warn', t: 'Size does not match conviction: ' + off.map((d) => d.tk).join(', '), act: 'tab', v: 'book', b: 'Book' });
  const stale = hs.filter((d) => diffDays(d.date, s) > 90);
  if (stale.length) nudges.push({ lvl: 'info', t: 'Thesis not re-checked in 90+ days: ' + stale.map((d) => d.tk).join(', '), act: 'tab', v: 'book', b: 'Book' });
  const n = hs.length + watching().length;
  if (n > D.settings.ideaCap) nudges.push({ lvl: 'warn', t: n + ' names followed, cap is ' + D.settings.ideaCap + '. Something has to go.', act: 'tab', v: 'book', b: 'Book' });

  if (nudges.length) {

    '<textarea data-act="dnote" data-k="' + s + '" placeholder="One or two lines">' + esc(dd.note || '') + '</textarea>' +
    '<div class="when" id="dsaved"></div></div>';

      '<div class="rt">' + esc(c.t) + '</div><div class="small mute">' + esc(c.why || '') + '</div>' +

  }

  const used = tradesInMonth(mk);

    stat(urgesInMonth(mk), 'Urges resisted') +
    stat(Object.values(D.decisions).filter((d) => d.override && doneMonth(d) === mk).length, 'Cool-offs overridden') +
    stat(due.length, 'Reviews due') + '</div>';
  h += '<div class="actions" style="margin-top:14px"><button class="btn big" data-act="tab" data-v="decide">Log a decision before acting</button></div>';
  return h;
}

/* ---------- Decide ---------- */
function newDraft(base) {
  return Object.assign({ type: 'buy', date: todayStr(), tk: '', px: '', size: '', conv: 5, p: 60, up: '', dn: '', thesis: '', variant: '', kill: '',
    premortem: '', why: [], planned: '', fw: '', fwWhy: '', clean: '', emo: [], pre: {} }, base || {});
}
function loadDraft() { try { const r = localStorage.getItem(DRAFT); if (r) return newDraft(JSON.parse(r)); } catch (e) {} return newDraft(); }
function keepDraft() { try { localStorage.setItem(DRAFT, JSON.stringify(draft)); } catch (e) {} }
let draft = loadDraft();

const THESIS_LBL = {
  buy: ['Thesis in one line', 'Why this, why now, at this price'], add: ['Why add now?', 'What changed since the last decision'],
  hold: ['Why hold?', 'The thesis as it stands today'], trim: ['Why trim?', 'What changed, or why the size is wrong'],
  sell: ['Why sell, in one line', 'Thesis broken? Better idea? Be honest'], pass: ['Why pass?', 'What would have to change for a yes'],
  watch: ['What would make this a buy?', 'The price or event that turns it on']
};
function ftext(k, label, ph, multi) {

}

function frange(k, label, min, max, step, suf) {

}
function fchips(k, opts, arr) {

}
function vDecide() {

  h += '<div class="card"><div class="ch">The thinking</div>' + ftext('thesis', THESIS_LBL[ty][0], THESIS_LBL[ty][1], true) +

    (on(['sell', 'trim']) ? '<div class="q">Why sell?</div>' + fchips('why', SELLWHY, F.why) : '') +

  h += '<div class="card"><div class="ch">State of mind</div><div class="q">Right now I feel</div>' + fchips('emo', EMO, F.emo) +
    (tp.trade ? '<div class="q">Was this trade in my plan before today?</div>' + seg('fset', 'planned', [{ id: 'yes', t: 'Yes, planned' }, { id: 'no', t: 'No, new' }], F.planned) : '') +

  const hiC = S.filter((r) => num(r.d.conv) >= 8 && isNum(r.e)), loC = S.filter((r) => num(r.d.conv) < 5 && isNum(r.e));

  }

  const top = Object.keys(counts).map((k) => ({ t: TAGS.find((x) => x.id === k), n: counts[k] })).filter((x) => x.t).sort((a, b) => b.n - a.n);

      (w[worst.id] > 1 ? '<div class="small" style="margin-top:8px">Your rule of the day now leans toward <b>' + esc(worst.t) + '</b>, where most of your tagged mistakes sit.</div>' : '') + '</div>';

/* ---------- GitHub backup ---------- */
function ghCfg() { try { return JSON.parse(localStorage.getItem(GHKEY)) || {}; } catch (e) { return {}; } }
function ghOn() { const g = ghCfg(); return !!(g.owner && g.repo && g.token); }
function ghUrl(g) { return 'https://api.github.com/repos/' + encodeURIComponent(g.owner) + '/' + encodeURIComponent(g.repo) + '/contents/' + (g.path || 'investor-coach.json').split('/').map(encodeURIComponent).join('/'); }
function ghHeaders(g) { return { 'Authorization': 'Bearer ' + g.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' }; }
function ghErr(st) {
  return ({ 401: 'token rejected (expired or mistyped)', 403: 'token has no write access to this repo', 404: 'repo not found, or the token does not cover it', 409: 'conflict, will retry', 422: 'GitHub rejected the file' })[st] || ('GitHub error ' + st);
}
function b64e(str) { const b = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64d(s) { const bin = atob(s.replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
async function ghGet(g) {
  const r = await fetch(ghUrl(g), { headers: ghHeaders(g), cache: 'no-store' });
  if (r.status === 404) return null;
  if (!r.ok) throw new Error(ghErr(r.status));
  const j = await r.json();
  return { sha: j.sha, data: JSON.parse(b64d(j.content)) };
}
let syncing = false, syncAgain = false, syncTimer = null, syncMsg = '';
function syncLine() {
  if (syncMsg) return esc(syncMsg);
  if (!ghOn()) return 'GitHub backup is off.';
  return localStorage.getItem(DIRTY) ? 'Changes waiting to back up.' : (D.lastBackup && D.lastBackup.how === 'github' ? 'Backed up to GitHub.' : '');
}
function setSync(m) { syncMsg = m; const el = document.getElementById('syncline'); if (el) el.textContent = m; }
function markDirty() {
  localStorage.setItem(DIRTY, '1');
  if (!ghOn()) return;
  clearTimeout(syncTimer); syncTimer = setTimeout(ghPush, 6000);
}
async function ghPush() {
  if (!ghOn() || !navigator.onLine) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; setSync('Backing up…');
  const g = ghCfg();
  try {
    for (let attempt = 0; attempt < 3; attempt++) {
      const cur = await ghGet(g);
      if (cur && cur.data) mergeIn(cur.data, true);
      const body = { message: 'Backup ' + new Date().toISOString(), content: b64e(JSON.stringify(D)) };
      if (cur) body.sha = cur.sha;
      const r = await fetch(ghUrl(g), { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, ghHeaders(g)), body: JSON.stringify(body) });
      if (r.ok) {
        localStorage.removeItem(DIRTY);
        D.lastBackup = { at: new Date().toISOString(), how: 'github' }; persist();
        const n = new Date(); setSync('Backed up to GitHub at ' + pad(n.getHours()) + ':' + pad(n.getMinutes()) + '.');
        return;
      }
      if (r.status !== 409 && r.status !== 422) throw new Error(ghErr(r.status));
    }
    throw new Error('kept conflicting, try again');
  } catch (e) {
    setSync('Backup failed: ' + e.message);
  } finally {
    syncing = false;
    if (syncAgain) { syncAgain = false; setTimeout(ghPush, 1000); }
  }
}

/* ---------- Merge (restore): never drops an entry ---------- */
function deepFill(a, b) {
  if (a === undefined || a === null || a === '') return b;
  if (typeof a === 'object' && !Array.isArray(a) && b && typeof b === 'object' && !Array.isArray(b)) { for (const k in b) a[k] = deepFill(a[k], b[k]); return a; }
  return a;
}
function mergeIn(inc, quiet) {
  if (!inc || typeof inc !== 'object' || !inc.decisions || typeof inc.decisions !== 'object') throw new Error('This is not an Investor Coach backup.');
  D.deleted = Object.assign({}, inc.deleted || {}, D.deleted || {});
  let added = 0;
  for (const id in inc.decisions) {
    if (D.deleted[id]) continue;
    if (!D.decisions[id]) added++;
    D.decisions[id] = deepFill(D.decisions[id], inc.decisions[id]);
  }
  ['days', 'weeks', 'cards', 'myCards', 'settings'].forEach((k) => { D[k] = deepFill(D[k] || {}, inc[k] || {}); });
  if (quiet) persist(); else save();
  return added;
}

  if (a === 'savefile') { saveFile(); return; }
  if (a === 'ghsave') {
    const g = {}; document.querySelectorAll('[data-gh]').forEach((i) => { g[i.dataset.gh] = i.value.trim(); });
    if (!g.owner || !g.repo || !g.token) { toast('Fill in owner, repo and token'); return; }
    localStorage.setItem(GHKEY, JSON.stringify(g)); localStorage.setItem(DIRTY, '1'); ghPush(); return;
  }
  if (a === 'ghpull') {
    if (!ghOn()) { toast('Set up GitHub backup first'); return; }
    setSync('Restoring…');
    ghGet(ghCfg()).then((r) => { if (!r) { setSync('No backup file in the repo yet.'); return; } const n = mergeIn(r.data); setSync('Restored. ' + plural(n, 'new decision') + ' added.'); render(); })
      .catch((err) => setSync('Restore failed: ' + err.message));
    return;
  }
  if (a === 'ghclear') { const g = ghCfg(); delete g.token; localStorage.setItem(GHKEY, JSON.stringify(g)); setSync(''); render(); toast('Token removed from this device'); }
});
let noteTimer = null, wkTimer = null;
document.addEventListener('input', (e) => {
  const el = e.target, ds_ = el.dataset || {};
  if (ds_.f) {
    draft[ds_.f] = el.type === 'range' ? Number(el.value) : el.value;
    if (el.type === 'range') { const lv = document.getElementById('lv-' + ds_.f); if (lv) lv.textContent = el.value + ds_.suf; }
    keepDraft(); const w = $('#warn'); if (w && ds_.f !== 'fw') w.innerHTML = warnHtml(); return;
  }
  if (ds_.act === 'dnote') {
    dayRec(ds_.k, true).note = el.value;
    clearTimeout(noteTimer); noteTimer = setTimeout(() => { save(); const s = $('#dsaved'); if (s) s.textContent = 'Saved'; }, 600); return;
  }
  if (ds_.act === 'wk') {
    const wk = monday(todayStr()), W = D.weeks[wk] = D.weeks[wk] || {};
    W[ds_.k] = el.value; W.at = new Date().toISOString();
    clearTimeout(wkTimer); wkTimer = setTimeout(() => { save(); const s = $('#wksaved'); if (s) s.textContent = 'Saved'; }, 600);
  }
});
document.addEventListener('change', (e) => {
  const el = e.target, a = el.dataset && el.dataset.act, k = el.dataset && el.dataset.k;
  if (el.dataset && el.dataset.f === 'fw') { draft.fw = el.value; keepDraft(); render(); return; }
  if (el.dataset && el.dataset.f === 'date') { const w = $('#warn'); if (w) w.innerHTML = warnHtml(); return; }
  if (a === 'setting') { const n = num(el.value); if (!isNum(n) || n < 0) { toast('Enter a number'); el.value = D.settings[k]; return; } D.settings[k] = n; save(); render(); toast('Saved'); return; }
  if (a === 'restorefile') {
    const f = el.files && el.files[0]; if (!f) return;
    f.text().then((txt) => { const n = mergeIn(JSON.parse(txt)); render(); toast('Restored. ' + plural(n, 'new decision') + ' added.'); })
      .catch((err) => toast(err.message || 'Could not read that file'));
  }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden' && localStorage.getItem(DIRTY) && ghOn()) { clearTimeout(syncTimer); ghPush(); }
  if (document.visibilityState === 'visible' && view === 'today') render();
});

/* ---------- Start ---------- */
render();
if (localStorage.getItem(DIRTY) && ghOn()) setTimeout(ghPush, 1500);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
